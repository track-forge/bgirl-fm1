name: Browser and host checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.10'
      - run: python -m pip install Pillow==12.1.1 fonttools==4.68.0
      - run: ./build.sh --web
      - run: ./tests/run_tests.sh
