name: SH-01A read-only capture
on:
  push:
    paths: ['tools/sh01a/**', 'tools/sh_style/**', 'assets/sh-style/**', '.github/workflows/sh01a.yml']
  pull_request:
    paths: ['tools/sh01a/**', 'tools/sh_style/**', 'assets/sh-style/**', '.github/workflows/sh01a.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r tools/sh01a/requirements-test.txt
      - run: python -m unittest discover -s tools/sh01a/tests -v
      - run: python -m tools.sh01a inventory
      - run: python -m unittest discover -s tools/sh_style/tests -v
