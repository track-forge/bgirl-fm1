# BGIRL development settings (tools/build.py)
name = "BGIRL"              # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_11" # UNALLOCATED: inherited placeholder, not for device packaging          # package identity (each firmware its own): dev FM-1_1100, releases FM-1_11XXYYZZ
usb_manufacturer = "Track Forge"
usb_product = "BGIRL FM-1"
o2 = ["dsp/electro.c", "dsp/vocoder.c"]                        # separate units compiled at -O2 (an app's DSP)
words = "words.tsv"
ble = true                     # Bluetooth MIDI (--no-ble builds without it)
ble_central = true             # and the FM-1 connects to Bluetooth MIDI devices too
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "Pocket electro, host/browser development slice"
repo = "https://github.com/track-forge/bgirl-fm1"
licence = "MPL-2.0"
credits = ""                   # a sentence for the installer's footer: what your firmware is built from
# firmware.json, for firmware hubs (docs/FIRMWARE-JSON.md): the build writes it from these and the keys above
author = "Track Forge"      # who made it
tags = ["synth", "utility"]    # from the list in docs/FIRMWARE-JSON.md; the build refuses another
description = "Experimental pocket electro instrument. Host/browser only; no device package identity allocated."
